    <!-- DIARY-CARD-START : 이 블록은 매일 재생성 시에도 그대로 유지할 것 -->
    <div class="list diary">
      <div id="diaryTools" style="display:none;margin:0 0 14px;padding:12px 14px;border:1px solid #E3E0D8;border-radius:8px;background:#fff">
        <div class="date-label" id="diaryToolsNote" style="margin:0 0 10px"></div>
        <div class="btns">
          <button id="btnMigrate" type="button">시트로 옮기기</button>
          <button id="btnBackup" type="button">백업 파일로 내려받기</button>
          <button id="btnBook" type="button">책자용 PDF 만들기</button>
          <span class="status" id="diaryToolsStatus"></span>
        </div>
      </div>

      <div id="diarySyncBox">
        <iframe id="diaryFrame" title="일기 쓰기"
                src="https://script.google.com/macros/s/AKfycbzfUE_UHUny92CdHKdpdq9qv0mSOAxXl1VSGFVueW4yCihS1BfuJ42y_FGBQyuhQLBVcQ/exec"
                style="width:100%;border:0;height:420px;display:block;background:transparent;overflow:hidden"></iframe>
      </div>

      <div id="diaryLocalBox" style="display:none">
        <p class="date-label" id="diaryFallbackNote"></p>
        <p class="date-label" id="diaryDate"></p>
        <textarea id="diaryText" placeholder="오늘 하루를 몇 줄로 남겨 두세요."></textarea>
        <div class="btns">
          <button class="primary" id="btnSave" type="button">저장하기</button>
          <button id="btnList" type="button">이전 일기 불러오기</button>
          <button id="btnToday" type="button" style="display:none">오늘 일기로 돌아가기</button>
          <span class="status" id="diaryStatus"></span>
        </div>
        <div class="entries" id="entries"></div>
      </div>
    </div>
    <script>
    (function(){
      /* --- 시트 일기장(iframe) 연결 --- */
      var MIGRATED='morning-brief-diary-migrated-v1';
      var KEY0='morning-brief-diary-v1';
      var frame=document.getElementById('diaryFrame');
      var syncBox=document.getElementById('diarySyncBox');
      var localBox=document.getElementById('diaryLocalBox');
      var ready=false;
      var frameWin=null;

      function oldEntries(){
        var out=[];
        try{
          var s=JSON.parse(localStorage.getItem(KEY0)||'{}');
          for(var k in s){ if(s[k]&&s[k].text) out.push({date:k,text:s[k].text}); }
        }catch(e){}
        out.sort(function(a,b){return a.date<b.date?1:-1});
        return out;
      }
      function tStatus(msg,ok){
        var el=document.getElementById('diaryToolsStatus');
        el.textContent=msg||''; el.style.color=ok?'#2f7d4f':'';
      }
      function refreshTools(){
        var n=oldEntries().length;
        var box=document.getElementById('diaryTools');
        box.style.display='';
        document.getElementById('btnMigrate').style.display=n?'':'none';
        document.getElementById('diaryToolsNote').textContent= n
          ? ('이 브라우저에 저장된 예전 일기 '+n+'건이 있습니다. 시트로 옮기거나 파일로 내려받아 두세요.')
          : '일기 보관 도구';
      }
      document.getElementById('btnBackup').onclick=function(){
        var list=oldEntries();
        if(!list.length){ tStatus('내려받을 일기가 없습니다.'); return; }
        var txt=list.map(function(e){return '['+e.date+']\n'+e.text+'\n'}).join('\n');
        var a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
        a.download='일기백업_'+new Date().toISOString().slice(0,10)+'.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        tStatus('내려받았습니다. 다운로드 폴더를 확인하세요.',true);
      };
      /* ---- 책자용 PDF 만들기 ---- */
      var sheetCache=null;
      function mergeEntries(a,b){
        var m={};
        (a||[]).forEach(function(e){ if(e&&e.date&&e.text) m[e.date]=e.text; });
        (b||[]).forEach(function(e){ if(e&&e.date&&e.text) m[e.date]=e.text; });
        return Object.keys(m).sort().map(function(k){ return {date:k,text:m[k]}; });
      }
      function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
      function kDate(ds){
        var p=ds.split('-'), d=new Date(p[0],p[1]-1,p[2]);
        return {y:+p[0],m:+p[1],d:+p[2],w:['일','월','화','수','목','금','토'][d.getDay()]};
      }
      function makeBook(entries){
        if(!entries.length){ tStatus('만들 일기가 없습니다.'); return; }
        var first=kDate(entries[0].date), last=kDate(entries[entries.length-1].date);
        var period=first.y+'년 '+first.m+'월'+(first.y===last.y&&first.m===last.m?'':' – '+last.y+'년 '+last.m+'월');
        var body='', curMonth='';
        entries.forEach(function(e){
          var k=kDate(e.date), mk=k.y+'-'+k.m;
          if(mk!==curMonth){
            curMonth=mk;
            body+='<h2 class="mon">'+k.y+'년 '+k.m+'월</h2>';
          }
          body+='<article><h3>'+k.m+'월 '+k.d+'일 <span>'+k.w+'요일</span></h3><p>'+esc(e.text).replace(/\n/g,'<br>')+'</p></article>';
        });
        var html='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>일기 '+period+'</title><style>'
        +'@page{size:A4;margin:22mm 20mm 20mm}'
        +'*{box-sizing:border-box}'
        +'body{margin:0;font-family:"Noto Serif KR",Batang,serif;color:#1d1c19;line-height:1.85;font-size:11.2pt}'
        +'.cover{height:calc(100vh - 44mm);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;page-break-after:always}'
        +'.cover h1{font-size:34pt;font-weight:600;margin:0 0 18px;letter-spacing:.06em}'
        +'.cover .p{font-size:13pt;color:#6b6a63;margin:0 0 6px}'
        +'.cover .rule{width:52px;border-top:2px solid #C6613F;margin:26px auto 0}'
        +'.mon{page-break-before:always;font-size:19pt;font-weight:600;margin:0 0 22px;padding-bottom:9px;border-bottom:1px solid #d8d4cb;letter-spacing:.04em}'
        +'.mon:first-of-type{page-break-before:avoid}'
        +'article{page-break-inside:avoid;margin:0 0 24px}'
        +'article h3{font-size:12.4pt;font-weight:600;margin:0 0 7px;color:#C6613F}'
        +'article h3 span{color:#8a8880;font-weight:400;font-size:10.4pt;margin-left:3px}'
        +'article p{margin:0;white-space:normal;text-align:justify}'
        +'@media screen{body{background:#f2f0ea}.sheet{background:#fff;max-width:210mm;margin:16px auto;padding:22mm 20mm;box-shadow:0 2px 14px rgba(0,0,0,.12)}'
        +'.bar{position:sticky;top:0;background:#1d1c19;color:#fff;padding:12px 18px;font-family:sans-serif;font-size:14px;display:flex;gap:12px;align-items:center;z-index:9}'
        +'.bar button{font:inherit;padding:7px 16px;border-radius:18px;border:0;background:#C6613F;color:#fff;cursor:pointer}}'
        +'@media print{.bar{display:none}.sheet{margin:0;padding:0;box-shadow:none;max-width:none}}'
        +'</style></head><body>'
        +'<div class="bar"><button onclick="window.print()">PDF로 저장 / 인쇄</button>'
        +'<span>인쇄 창에서 «대상»을 «PDF로 저장»으로 고르세요. 총 '+entries.length+'편</span></div>'
        +'<div class="sheet"><div class="cover"><h1>일 기</h1><div class="p">'+period+'</div>'
        +'<div class="p">모두 '+entries.length+'편</div><div class="rule"></div></div>'+body+'</div></body></html>';
        var w=window.open('','_blank');
        if(!w){ tStatus('팝업이 차단됐습니다. 주소창 오른쪽에서 팝업을 허용해 주세요.'); return; }
        w.document.write(html); w.document.close();
        tStatus('책자를 새 탭에 열었습니다. «PDF로 저장»을 누르세요.',true);
      }
      document.getElementById('btnBook').onclick=function(){
        tStatus('일기를 모으는 중…');
        var local=oldEntries();
        if(frameWin){
          sheetCache=null;
          frameWin.postMessage({type:'diary-export-request'},'*');
          setTimeout(function(){ makeBook(mergeEntries(local,sheetCache)); },1400);
        } else {
          makeBook(mergeEntries(local,null));
        }
      };
      document.getElementById('btnMigrate').onclick=function(){
        var list=oldEntries();
        if(!list.length){ tStatus('옮길 일기가 없습니다.'); return; }
        if(!frameWin){ tStatus('시트 일기장이 아직 준비되지 않았습니다. 잠시 뒤 다시 눌러 주세요.'); return; }
        tStatus('옮기는 중…');
        frameWin.postMessage({type:'diary-import',entries:list},'*');
      };

      function showLocal(reason){
        if(ready) return;
        syncBox.style.display='none';
        localBox.style.display='';
        document.getElementById('diaryFallbackNote').textContent=reason;
      }
      /* 8초 안에 시트 일기장이 응답하지 않으면(쿠키 차단 등) 브라우저 저장 일기로 전환 */
      var failTimer=setTimeout(function(){
        showLocal('시트 일기장을 불러오지 못했습니다(브라우저의 쿠키 차단 때문일 수 있습니다). 이 기기에 저장되는 일기로 대신 씁니다.');
      },14000);

      window.addEventListener('message',function(ev){
        var d=ev.data; if(!d||!d.type) return;
        if(d.type==='diary-ready'){
          ready=true; clearTimeout(failTimer);
          frameWin=ev.source||null;
          refreshTools();
          /* 예전에 이 브라우저에 저장해 둔 일기를 한 번만 시트로 올린다 */
          try{
            if(!localStorage.getItem(MIGRATED)){
              var s=JSON.parse(localStorage.getItem(KEY0)||'{}');
              var list=[];
              for(var k in s){ if(s[k]&&s[k].text) list.push({date:k,text:s[k].text}); }
              if(list.length&&ev.source){ ev.source.postMessage({type:'diary-import',entries:list},'*'); tStatus('예전 일기를 옮기는 중…'); }
              else { localStorage.setItem(MIGRATED,'1'); }
            }
          }catch(e){}
        }
        if(d.type==='diary-export-data'){ sheetCache=d.entries||[]; }
        if(d.type==='diary-import-done'){
          try{ localStorage.setItem(MIGRATED,'1'); }catch(e){}
          tStatus('시트로 '+(d.imported||0)+'건을 옮겼습니다. 이제 다른 기기에서도 보입니다.',true);
        }
        if(d.type==='diary-height'&&d.height){
          frame.style.height=Math.max(320,d.height+24)+'px';
        }
      });

      /* --- 아래는 기존 브라우저 저장 일기(예비용). 시트가 안 뜰 때만 화면에 나온다. --- */
      var KEY='morning-brief-diary-v1';
      var $=function(id){return document.getElementById(id)};
      var ta=$('diaryText'),st=$('diaryStatus'),list=$('entries'),btnToday=$('btnToday');
      function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
      var editing=todayStr();
      function store(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
      function put(s){localStorage.setItem(KEY,JSON.stringify(s))}
      function fmt(ds){var p=ds.split('-');var d=new Date(p[0],p[1]-1,p[2]);
        return p[0]+'년 '+Number(p[1])+'월 '+Number(p[2])+'일 ('+['일','월','화','수','목','금','토'][d.getDay()]+')'}
      function setEditing(ds){editing=ds;var s=store();ta.value=(s[ds]&&s[ds].text)||'';
        $('diaryDate').textContent=fmt(ds)+(ds===todayStr()?' · 오늘':'');
        btnToday.style.display=(ds===todayStr())?'none':'inline-block';st.textContent=''}
      function save(auto){var s=store();var t=ta.value;
        if(!t.trim()){delete s[editing]}else{s[editing]={text:t,savedAt:Date.now()}}
        put(s);var n=new Date();
        st.textContent=(auto?'자동 저장됨 ':'저장됨 ')+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
        if(list.classList.contains('show'))render()}
      function render(){var s=store();var days=Object.keys(s).sort().reverse();list.innerHTML='';
        if(!days.length){var e=document.createElement('div');e.className='empty-entries';
          e.textContent='저장된 일기가 아직 없습니다.';list.appendChild(e);return}
        days.forEach(function(ds){var row=document.createElement('div');row.className='entry';
          var d1=document.createElement('span');d1.className='edate';d1.textContent=fmt(ds);
          var d2=document.createElement('span');d2.className='epreview';d2.textContent=s[ds].text.split('\n')[0];
          var d3=document.createElement('span');d3.className='edel';d3.textContent='지우기';
          d3.onclick=function(ev){ev.stopPropagation();
            if(confirm(fmt(ds)+' 일기를 지울까요?')){var s2=store();delete s2[ds];put(s2);render();
              if(editing===ds)setEditing(todayStr())}};
          row.onclick=function(){setEditing(ds);list.classList.add('show')};
          row.appendChild(d1);row.appendChild(d2);row.appendChild(d3);list.appendChild(row)})}
      var timer=null;
      ta.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){save(true)},1200)});
      $('btnSave').onclick=function(){clearTimeout(timer);save(false)};
      $('btnList').onclick=function(){list.classList.toggle('show');if(list.classList.contains('show'))render()};
      btnToday.onclick=function(){setEditing(todayStr())};
      window.addEventListener('beforeunload',function(){if(ta.value.trim()){clearTimeout(timer);save(true)}});
      setEditing(todayStr());
      refreshTools();
    })();
    </script>
    <!-- DIARY-CARD-END -->
